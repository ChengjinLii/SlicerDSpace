# Optimized defaults for DDSurfer postprocess pipeline.
#
# Priority order:
#   1. CLI arguments from run.sh
#   2. Exported environment variables
#   3. Defaults below

PIPELINE_ROOT=${PIPELINE_ROOT:?PIPELINE_ROOT must be set by run.sh before sourcing config}

# Inputs / outputs
INPUTS_DIR=${INPUTS_DIR:-${PIPELINE_ROOT}/inputs}
OUTPUTS_DIR=${OUTPUTS_DIR:-${PIPELINE_ROOT}/outputs}

# Staging mode:
#   copy    -> copy only required mri/surf inputs into internal FreeSurfer workdir
#   symlink -> symlink required mri/surf inputs into internal FreeSurfer workdir
#   inplace -> operate directly in inputs/<subject_id> (not recommended for production)
STAGE_MODE=${STAGE_MODE:-copy}

# Runtime
FREESURFER_HOME=${FREESURFER_HOME:-}
PYTHON_BIN=${PYTHON_BIN:-python3}

# Stage selection
DEFAULT_STAGES=${DEFAULT_STAGES:-validate_inputs,stage_inputs,convert_surfaces,build_fs_surfaces,project_annotations,extract_labels,compute_stats,resample_fsaverage,sync_outputs}

# Atlas selection
DEFAULT_ATLASES=${DEFAULT_ATLASES:-aparc,aparc.a2009s,Yeo2011_7Networks_N1000,Yeo2011_17Networks_N1000,PALS_B12_Brodmann,PALS_B12_Lobes}

# Helper scripts
PYTHON_CONVERT_SCRIPT=${PYTHON_CONVERT_SCRIPT:-${PIPELINE_ROOT}/src/convert_stl_to_fs.py}
PYTHON_AREA_SCRIPT=${PYTHON_AREA_SCRIPT:-${PIPELINE_ROOT}/src/compute_surface_area.py}
PYTHON_THICKNESS_SCRIPT=${PYTHON_THICKNESS_SCRIPT:-${PIPELINE_ROOT}/src/compute_thickness.py}
PYTHON_EXTRACT_CTAB_SCRIPT=${PYTHON_EXTRACT_CTAB_SCRIPT:-${PIPELINE_ROOT}/src/extract_ctab.py}
PYTHON_REGIONAL_STATS_SCRIPT=${PYTHON_REGIONAL_STATS_SCRIPT:-${PIPELINE_ROOT}/src/compute_regional_stats.py}
PYTHON_VALIDATE_SCRIPT=${PYTHON_VALIDATE_SCRIPT:-${PIPELINE_ROOT}/src/validate_inputs.py}
PYTHON_REPORT_SCRIPT=${PYTHON_REPORT_SCRIPT:-${PIPELINE_ROOT}/src/write_pipeline_report.py}
