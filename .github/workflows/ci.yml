name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  distribution-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check resource contract and package contents
        run: |
          python -m unittest discover -s Testing/Python -p test_extension_distribution.py -v
          python -m unittest discover -s Testing/Python -p test_third_party_notices.py -v
      - name: Check metadata and documentation
        run: |
          python scripts/audit_slicer_extension_metadata.py --json
          python scripts/audit_documentation.py
          python scripts/audit_third_party.py

  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install fast-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/dev/requirements-ci.txt

      - name: Run fast unit tests
        run: make test-fast

      - name: Audit Slicer extension metadata
        run: python3 scripts/audit_slicer_extension_metadata.py --json

      - name: Audit release metadata and LFS pointers
        run: python3 scripts/release_audit.py

      - name: Verify third-party notice integrity and packaging
        run: python3 scripts/audit_third_party.py

      - name: Resolve model asset manifest without downloading assets
        run: python3 scripts/download_model_assets.py --profile core --print-plan

      - name: Verify lightweight model-asset sentinel download
        run: |
          python3 scripts/download_model_assets.py \
            --profile sentinel \
            --asset-root "$RUNNER_TEMP/slicerdsurfer-model-sentinel" \
            --source url \
            --source-id slicerdsurfer_models_git

  fresh-clone-smoke:
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install fast-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/dev/requirements-ci.txt

      - name: Fresh clone smoke without model download
        run: |
          SMOKE_REPO_URL="$GITHUB_WORKSPACE" \
          SMOKE_REF="$GITHUB_SHA" \
          SMOKE_ASSET_MODE=plan \
          SMOKE_ROOT="$RUNNER_TEMP/slicerdsurfer-fresh-clone-smoke" \
          make fresh-clone-smoke

      - name: Preserve fresh-clone diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-clone-diagnostics
          path: |
            ${{ runner.temp }}/slicerdsurfer-fresh-clone-smoke/fresh_clone_smoke_report.json
            ${{ runner.temp }}/slicerdsurfer-fresh-clone-smoke/steps.jsonl
            ${{ runner.temp }}/slicerdsurfer-fresh-clone-smoke/logs/
          if-no-files-found: warn
          retention-days: 14
